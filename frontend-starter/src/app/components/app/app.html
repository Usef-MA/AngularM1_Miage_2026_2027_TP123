<header>
  <div>
    <b>Guitar Practice Cloud</b>
    <small>Le cloud qui manque à votre ampli</small>
  </div>
  <nav aria-label="Navigation principale">
    <!-- auth.token() est un signal : on l'appelle comme une fonction pour
         lire sa valeur actuelle. S'il contient un JWT, l'utilisateur est
         considéré comme connecté. -->
    @if (auth.token()) {
      <a routerLink="/tracks">Backing tracks</a>
      <a routerLink="/profile">Profil</a>
      <button type="button" (click)="logout()">Déconnexion</button>
    } @else {
      <a routerLink="/login">Connexion</a>
      <a routerLink="/register">Inscription</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>
